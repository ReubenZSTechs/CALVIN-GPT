server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip supaya bundle JS/CSS lebih ringan dikirim
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset statis (JS/CSS/gambar hasil build Vite) di-cache lama karena
    # nama filenya sudah di-hash (mis. index-abc123.js)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: semua route yang tidak match file statis diarahkan
    # ke index.html supaya client-side routing (react-router dsb) jalan
    location / {
        try_files $uri $uri/ /index.html;
    }
}