services:

  # Model Servers
  llm:
    image: vllm/vllm-openai:v0.26.0
    container_name: llm-server
    runtime: nvidia
    volumes:
      - ./models:/models
    ports:
      - "15000:15000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
    command: >
      /models/models--nvidia--Llama-3.1-8B-Instruct-NVFP4
      --served_model_name llm
      --quantization modelopt_fp4
      --hf_overrides '{"tie_word_embeddings": false}'
      --max_model_len 32768
      --gpu_memory_utilization 0.7
      --kv_cache_dtype turboquant_4bit_nc
      --port 15000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 1800s
    restart: unless-stopped


  embedding:
    image: vllm/vllm-openai:v0.26.0
    container_name: embedding-server
    runtime: nvidia
    volumes:
      - ./models:/models
    ports:
      - "15001:15001"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
    command: >
      /models/models--BAAI--bge-m3
      --served_model_name embedding
      --max_model_len 8192
      --gpu_memory_utilization 0.15
      --port 15001
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped


networks:
  default:
    name: calvin-gpt-net
    external: true